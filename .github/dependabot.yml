# Canonical Dependabot config for the WYRE-AI *-mcp / node-* fleet.
#
# Goal: keep PR volume manageable for a small team. Updates are GROUPED so a
# repo gets a handful of PRs per week instead of one-per-package, and the
# dependabot-janitor (daily) auto-merges the green grouped PRs. Only
# PRODUCTION-dependency MAJOR bumps land as individual PRs for human review,
# since those can carry behavioural breaking changes a green test suite misses.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      # All dev/CI tooling (eslint, vitest, typescript, @types/*, etc.) incl.
      # majors → ONE PR. The janitor auto-merges it when CI is green.
      #
      # LIFTED 2026-08-21 the 2026-07-20 major-exclusion stopgap: a grouped
      # major bump (e.g. typescript 6->7) had auto-merged blind against this
      # repo's then-thin-caller release.yml, which had no PR-time build/test
      # job -- broke main twice in 2 days. This repo has since gained a real
      # ci.yml (build/lint/test on push+PR), confirmed wired as a REQUIRED
      # status check ("build") in branch protection -- the exact durable fix
      # the stopgap was waiting on. Majors now group with minor/patch like
      # the fleet-standard shape (see nutanix-mcp's dependabot.yml). The
      # typescript-specific ignore below stays regardless -- unrelated
      # reason (toolchain incompatibility, not CI-gating).
      dev-dependencies:
        dependency-type: "development"
        update-types: ["major", "minor", "patch"]
      # Production minor + patch → ONE PR. Auto-merged when green.
      production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    # Production MAJORS are intentionally NOT grouped → individual PRs, held for
    # human review (never auto-merged).
    ignore:
      # typescript 7.x breaks this fleet's toolchain: DTS emit (tsup/rollup-plugin-dts
      # TS5101 baseUrl-deprecated-as-error), and typescript-eslint (still <6.1.0 as of
      # 8.66.0, no TS7 support yet). Has broken main 3x on some repos because Dependabot
      # has no memory of a prior manual revert and just re-proposes the same major again.
      # Deliberate hold, not a permanent blind -- remove once typescript-eslint + the
      # tsup/DTS toolchain support TS7.
      #
      # Added 2026-08-20, independent of the (now-lifted, see above) 07-20
      # major-exclusion stopgap -- this hold is toolchain incompatibility,
      # not CI-gating, so it applies regardless of that stopgap's status.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "docker"
      include: "scope"
    groups:
      docker:
        patterns: ["*"]
